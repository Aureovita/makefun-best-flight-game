<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Vale — Valley Flight School</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1410; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { z-index: 0; }
  #hud { z-index: 1; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="gl" aria-label="Kestrel Vale: a valley flight school. Fly a small prop plane through gates, or land it on the strip."></canvas>
<canvas id="hud"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
